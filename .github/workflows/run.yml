name: Run Quiz Updater

on:
  schedule:
    # 06:30 VN = 23:30 UTC
    - cron: "30 23 * * *"
    
    # 07:00 VN = 00:00 UTC
    - cron: "0 0 * * *"
    
    # 07:30 VN = 00:30 UTC
    - cron: "30 0 * * *"
    
    # 08:00 VN = 01:00 UTC
    - cron: "0 1 * * *"
    
    # 08:30 VN = 01:30 UTC
    - cron: "30 1 * * *"
    
    # 09:00 VN = 02:00 UTC
    - cron: "0 2 * * *"
    
    # 09:30 VN = 02:30 UTC
    - cron: "30 2 * * *"
    
    # 10:00 VN = 03:00 UTC
    - cron: "0 3 * * *"
    
    # 10:30 VN = 03:30 UTC
    - cron: "30 3 * * *"
    
    # 11:00 VN = 04:00 UTC
    - cron: "0 4 * * *"
    
  workflow_dispatch:   # Cho phép chạy thủ công trong tab Actions

jobs:
  run-script:
    runs-on: ubuntu-latest

    env:
      # OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run quiz updater
        run: python quiz_update.py
